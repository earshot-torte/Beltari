<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beltari: Night Sky Map</title>
  <meta name="description" content="What’s that bright star? Point at the sky, tap once, lower your phone. Every planet and constellation overhead, plus the bright stars you can see — identified by name.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f4ef;
      color: #444;
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Hero */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 80px 24px 60px;
    }
    .app-icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 28px;
    }
    .app-icon img {
      border-radius: 26px;
      display: block;
      width: 120px;
      height: 120px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
    }
    h1 {
      font-size: 42px;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 20px;
      color: #888;
      margin-bottom: 16px;
      font-weight: 500;
    }
    .tagline {
      font-size: 17px;
      color: #666;
      margin-bottom: 36px;
      max-width: 520px;
    }
    .cta-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .app-store-btn {
      display: inline-block;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .app-store-btn:hover { opacity: 0.8; }

    footer {
      text-align: center;
      padding: 32px 24px;
      max-width: 520px;
      margin: 0 auto;
      border-top: 1px solid #e8e6df;
      display: flex;
      justify-content: center;
      gap: 32px;
      flex-wrap: wrap;
    }
    footer a {
      font-size: 14px;
      color: #bbb;
      text-decoration: none;
    }
    footer a:hover { color: #666; }

    @media (max-width: 480px) {
      h1 { font-size: 32px; }
      .subtitle { font-size: 17px; }
      .tagline { font-size: 15px; }
    }
  </style>
</head>
<body>

  <div class="hero">
    <div class="app-icon"><img src="icon.png" alt="Beltari app icon"></div>
    <h1>Beltari: Night Sky Map</h1>
    <p class="subtitle">Star &amp; constellation finder</p>
    <p class="tagline">What&rsquo;s that bright star? Point at the sky, tap once, lower your phone. Every planet and constellation overhead, plus the bright stars you can see &mdash; identified by name.</p>
    <div class="cta-row">
      <a class="app-store-btn" href="https://apps.apple.com/us/app/beltari/id6760587533"><img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on the App Store" style="height: 44px;"></a>
    </div>
  </div>

  <footer>
    <a href="privacy.html">Privacy Policy</a>
    <a href="mailto:beltari.app@gmail.com">Support</a>
  </footer>

</body>
</html>
